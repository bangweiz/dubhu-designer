CreateVariableRequest:
  type: object
  required: [name, description, type]
  properties:
    type: {type: string, enum: [string, number, bool], example: string}
    name: {type: string, minLength: 1, maxLength: 200, example: customer_name}
    description: {type: string, minLength: 1, maxLength: 2000, example: Customer name variable}

UpdateVariableRequest:
  type: object
  required: [name, description]
  description: Type is immutable and must not be included in update requests.
  not:
    required: [type]
  properties:
    name: {type: string, minLength: 1, maxLength: 200, example: customer_name}
    description: {type: string, minLength: 1, maxLength: 2000, example: Customer name variable}

Variable:
  type: object
  required: [id, name, description, type, createdAt, updatedAt]
  properties:
    type: {type: string, enum: [string, number, bool], example: string}
    id: {type: string}
    name: {type: string}
    description: {type: string}
    createdBy: {type: string, readOnly: true, description: "Creating account ID; empty for legacy records with unknown provenance."}
    updatedBy: {type: string, readOnly: true, description: "Last modifying account ID; empty for legacy records with unknown provenance."}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
