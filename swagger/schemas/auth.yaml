Organisation:
  type: object
  required: [id, name, description, rootAccountId, createdAt, updatedAt]
  properties:
    id: {type: string}
    name: {type: string}
    description: {type: string}
    rootAccountId: {type: string}
    createdBy: {type: string, readOnly: true, description: "Creating account ID; empty for legacy records with unknown provenance."}
    updatedBy: {type: string, readOnly: true, description: "Last modifying account ID; empty for legacy records with unknown provenance."}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
Account:
  type: object
  required: [id, organisationId, name, email, role, createdAt, updatedAt]
  properties:
    id: {type: string}
    organisationId: {type: string}
    name: {type: string}
    email: {type: string, format: email}
    role: {type: string, enum: [root, admin, user]}
    createdBy: {type: string, readOnly: true, description: "Creating account ID; empty for legacy records with unknown provenance."}
    updatedBy: {type: string, readOnly: true, description: "Last modifying account ID; empty for legacy records with unknown provenance."}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
RootAccountRequest:
  type: object
  required: [name, email, password]
  properties:
    name: {type: string, minLength: 1, maxLength: 200}
    email: {type: string, format: email, maxLength: 254}
    password:
      type: string
      format: password
      writeOnly: true
      minLength: 15
      maxLength: 72
      description: At least 15 characters and no more than 72 UTF-8 bytes. Never returned.
CreateOrganisationRequest:
  type: object
  required: [name, description, rootAccount]
  properties:
    name: {type: string, minLength: 1, maxLength: 200}
    description: {type: string, minLength: 1, maxLength: 2000}
    rootAccount: {$ref: '#/RootAccountRequest'}
CreateOrganisationResponse:
  type: object
  required: [organisation, rootAccount]
  properties:
    organisation: {$ref: '#/Organisation'}
    rootAccount: {$ref: '#/Account'}
CreateAccountRequest:
  type: object
  required: [name, email, password, role]
  properties:
    name: {type: string, minLength: 1, maxLength: 200}
    email: {type: string, format: email, maxLength: 254}
    password:
      type: string
      format: password
      writeOnly: true
      minLength: 15
      maxLength: 72
      description: At least 15 characters and no more than 72 UTF-8 bytes.
    role: {type: string, enum: [admin, user], description: A second root account cannot be created.}
LoginRequest:
  type: object
  required: [email, password]
  properties:
    email: {type: string, format: email}
    password: {type: string, format: password, writeOnly: true, maxLength: 72}
LoginResponse:
  type: object
  required: [accessToken, tokenType, expiresAt, account]
  properties:
    accessToken: {type: string, description: Use in Authorization header as Bearer accessToken.}
    tokenType: {type: string, enum: [Bearer]}
    expiresAt: {type: string, format: date-time}
    account: {$ref: '#/Account'}
