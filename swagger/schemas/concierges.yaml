CreateConciergeRequest:
  type: object
  required:
    - name
    - description
  properties:
    name:
      type: string
      maxLength: 200
      description: Unique concierge name
      example: "front_desk_assistant"
    description:
      type: string
      maxLength: 2000
      description: Purpose and capabilities of the concierge
      example: "Handles customer inquiries and routing."

ConciergeSummary:
  type: object
  required: [id, name, description, conciergeVersions, agents, nextVersion, createdAt, updatedAt]
  properties:
    createdBy: {type: string, readOnly: true, description: "Creating account ID; empty for legacy records with unknown provenance."}
    updatedBy: {type: string, readOnly: true, description: "Last modifying account ID; empty for legacy records with unknown provenance."}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
    id:
      type: string
    name:
      type: string
    description:
      type: string
    agents:
      type: array
      items:
        $ref: './agents.yaml#/AgentSummary'
    nextVersion:
      type: integer
      minimum: 1
      description: Sequence number assigned to the next saved snapshot
    conciergeVersions:
      type: array
      items:
        $ref: '#/ConciergeVersionDescriptor'

Concierge:
  type: object
  required: [id, name, description, conciergeVersions, agents, nextVersion, createdAt, updatedAt]
  properties:
    createdBy: {type: string, readOnly: true, description: "Creating account ID; empty for legacy records with unknown provenance."}
    updatedBy: {type: string, readOnly: true, description: "Last modifying account ID; empty for legacy records with unknown provenance."}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
    id:
      type: string
    name:
      type: string
    description:
      type: string
    agents:
      type: array
      items:
        $ref: './agents.yaml#/AgentSummary'
    nextVersion:
      type: integer
      minimum: 1
      description: Sequence number assigned to the next saved snapshot
    conciergeVersions:
      type: array
      items:
        $ref: '#/ConciergeVersionDescriptor'

ConciergeVersionDeploymentRequest:
  type: object
  required: [environmentId]
  properties:
    environmentId:
      type: string
      description: ID of an environment belonging to this organisation

SavedConciergeVersion:
  type: object
  required: [id, conciergeId, version, name, description, agents, instructions, tools, variables, environmentIds, createdAt, updatedAt]
  properties:
    environmentIds:
      type: array
      description: Environment IDs this saved version is deployed to; empty when undeployed
      items: {type: string}
    id:
      type: string
      description: Concierge version ID
    conciergeId:
      type: string
    version:
      type: integer
    name: {type: string}
    description: {type: string}
    agents:
      type: array
      items:
        $ref: '#/SavedAgent'
    instructions:
      type: array
      items:
        $ref: '#/SavedInstruction'
    variables:
      type: array
      items:
        $ref: './variables.yaml#/Variable'
    tools:
      type: array
      items:
        $ref: './tools.yaml#/Tool'
    createdBy: {type: string, readOnly: true, description: "Creating account ID; empty for legacy records with unknown provenance."}
    updatedBy: {type: string, readOnly: true, description: "Last modifying account ID; empty for legacy records with unknown provenance."}
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

ConciergeVersionDescriptor:
  type: object
  required: [conciergeVersionId, version]
  properties:
    conciergeVersionId:
      type: string
    version:
      type: integer

SavedAgent:
  type: object
  required: [id, name, description, goal, model, instructions, tools, createdAt, updatedAt]
  properties:
    id:
      type: string
    conciergeId:
      type: string
      description: Parent concierge ID when present in the snapshot
    name:
      type: string
    description:
      type: string
    goal:
      type: string
    model:
      type: string
    instructions:
      type: array
      items:
        type: string
    tools:
      type: array
      items:
        type: string
    createdBy: {type: string, readOnly: true, description: "Creating account ID; empty for legacy records with unknown provenance."}
    updatedBy: {type: string, readOnly: true, description: "Last modifying account ID; empty for legacy records with unknown provenance."}
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

SavedInstruction:
  type: object
  required: [id, name, content, tools, variables, createdAt, updatedAt]
  properties:
    id:
      type: string
    name:
      type: string
    content:
      type: string
    variables:
      type: array
      items:
        type: string
    tools:
      type: array
      items:
        type: string
    createdBy: {type: string, readOnly: true, description: "Creating account ID; empty for legacy records with unknown provenance."}
    updatedBy: {type: string, readOnly: true, description: "Last modifying account ID; empty for legacy records with unknown provenance."}
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
