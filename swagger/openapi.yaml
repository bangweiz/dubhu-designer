openapi: 3.0.3
info:
  title: Dubhu Designer API
  description: API specification for Dubhu Designer services.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

paths:
  /tools:
    post:
      summary: Create a new tool
      description: Creates a new tool specification with inputs, outputs, and versioning.
      operationId: createTool
      tags:
        - Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToolRequest'
            example:
              name: "http_request"
              description: "Sends an HTTP request and returns the response"
              inputs:
                - name: "url"
                  description: "Target URL"
                  required: true
                - name: "method"
                  description: "HTTP method (GET, POST, etc.)"
                  required: false
              outputs:
                - name: "status_code"
                  description: "HTTP status code"
                - name: "body"
                  description: "Response body payload"
      responses:
        '201':
          description: Tool created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tool'
        '400':
          description: Bad request (invalid payload or missing required fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "name"
                    reason: "tool name cannot exceed 200 characters"
                    value: "..."
        '409':
          description: Conflict (tool name already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Conflict"
                details:
                  - field: "name"
                    reason: "tool name already exists"
                    value: "http_request"
    get:
      summary: List all tools
      description: Retrieves all registered tool specifications without sorting, filtering, or pagination.
      operationId: listTools
      tags:
        - Tools
      responses:
        '200':
          description: List of tools retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tool'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to query tools"

  /tools/{toolId}:
    get:
      summary: Get tool by ID
      description: Retrieves a specific tool specification by its MongoDB ObjectID.
      operationId: getToolById
      tags:
        - Tools
      parameters:
        - name: toolId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the tool
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      responses:
        '200':
          description: Tool retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tool'
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Tool not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to find tool: connection refused"
    put:
      summary: Update tool by ID
      description: Updates an existing tool specification using optimistic concurrency control. All fields can be updated. The current version number is required in the request body. On success, the version number is incremented.
      operationId: updateTool
      tags:
        - Tools
      parameters:
        - name: toolId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the tool
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateToolRequest'
            example:
              name: "http_request_v2"
              description: "Updated HTTP request tool with timeout"
              version: 1
              inputs:
                - name: "url"
                  description: "Target URL"
                  required: true
                - name: "timeout"
                  description: "Request timeout in seconds"
                  required: false
              outputs:
                - name: "status_code"
                  description: "HTTP response status code"
      responses:
        '200':
          description: Tool updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tool'
        '400':
          description: Bad request (invalid payload or validation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "name"
                    reason: "tool name cannot exceed 200 characters"
                    value: "..."
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Tool not found"
        '409':
          description: Conflict (version mismatch / concurrency conflict or duplicate name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Conflict"
                details:
                  - field: "version"
                    reason: "tool was modified by another operation (version mismatch)"
                    value: 1
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to update tool"

  /instructions:
    post:
      summary: Create a new instruction
      description: Creates a new LLM instruction. The content can reference tools using the syntax {{tool:tool_id}}. The service parses these references, verifies that all referenced tools exist in the database, and populates the instruction's tools field with their ObjectIDs. If any referenced tool does not exist, the request is rejected with a 400 Bad Request.
      operationId: createInstruction
      tags:
        - Instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstructionRequest'
            example:
              name: "search_and_summarize"
              content: "Search the web using {{tool:651da3b57f8641a27e36c579}} and synthesize the findings."
      responses:
        '201':
          description: Instruction created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Instruction'
        '400':
          description: Bad request (invalid payload, validation failure, or referenced tools do not exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "referenced tools do not exist: 651da3b57f8641a27e36c579"
        '409':
          description: Conflict (instruction name already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Conflict"
                details:
                  - field: "name"
                    reason: "instruction name already exists"
                    value: "search_and_summarize"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to insert instruction"
    get:
      summary: List all instructions
      description: Retrieves all registered instructions without sorting, filtering, or pagination.
      operationId: listInstructions
      tags:
        - Instructions
      responses:
        '200':
          description: List of instructions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstructionSummary'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to query instructions"

  /instructions/{instructionId}:
    get:
      summary: Get instruction by ID
      description: Retrieves a specific instruction by its MongoDB ObjectID.
      operationId: getInstructionById
      tags:
        - Instructions
      parameters:
        - name: instructionId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the instruction
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      responses:
        '200':
          description: Instruction retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Instruction'
        '404':
          description: Instruction not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Instruction not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to find instruction"
    put:
      summary: Update instruction by ID
      description: Updates an existing instruction using optimistic concurrency control. All fields can be updated. Any tool references in content are resolved, and the request is rejected with 400 Bad Request if referenced tools do not exist. The current version number is required in the request body. On success, the version number is incremented.
      operationId: updateInstruction
      tags:
        - Instructions
      parameters:
        - name: instructionId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the instruction
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstructionRequest'
            example:
              name: "search_and_summarize_v2"
              content: "Search the web using {{tool:651da3b57f8641a27e36c579}} and format output as markdown."
              version: 1
      responses:
        '200':
          description: Instruction updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Instruction'
        '400':
          description: Bad request (invalid payload, validation failure, or referenced tools do not exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "referenced tools do not exist: 651da3b57f8641a27e36c579"
        '404':
          description: Instruction not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Instruction not found"
        '409':
          description: Conflict (version mismatch / concurrency conflict or duplicate name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Conflict"
                details:
                  - field: "version"
                    reason: "instruction was modified by another operation (version mismatch)"
                    value: 1
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to update instruction"

  /concierges:
    post:
      summary: Create a new concierge
      description: Creates a new concierge specification with initial version 1. Requires name and description.
      operationId: createConcierge
      tags:
        - Concierges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConciergeRequest'
            example:
              name: "front_desk_assistant"
              description: "Handles customer inquiries and routing."
      responses:
        '201':
          description: Concierge created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Concierge'
        '400':
          description: Bad request (invalid payload or validation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "name"
                    reason: "name is required and cannot be blank"
                    value: ""
        '409':
          description: Conflict (concierge name already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Conflict"
                details:
                  - field: "name"
                    reason: "concierge name already exists"
                    value: "front_desk_assistant"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to insert concierge"
    get:
      summary: List all concierges
      description: Retrieves a list of all concierges.
      operationId: listConcierges
      tags:
        - Concierges
      responses:
        '200':
          description: A list of concierges
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConciergeSummary'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to query concierges"

  /concierges/{conciergeId}:
    get:
      summary: Get concierge by ID
      description: Retrieves a specific concierge by its MongoDB ObjectID.
      operationId: getConciergeById
      tags:
        - Concierges
      parameters:
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      responses:
        '200':
          description: Concierge retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Concierge'
        '404':
          description: Concierge not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Concierge not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to find concierge"

  /concierges/{conciergeId}/agents:
    post:
      summary: Create a new agent
      description: Creates a new agent specification scoped to the specified concierge with initial version 1. Requires name, description, and model. Agent name must be unique within the same concierge.
      operationId: createAgent
      tags:
        - Agents
      parameters:
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
            example:
              name: "research_assistant"
              description: "Conducts deep literature research and analysis."
              model: "gemini-3.5-flash"
      responses:
        '201':
          description: Agent created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request (invalid payload or validation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "name"
                    reason: "name is required and cannot be blank"
                    value: ""
        '404':
          description: Concierge not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Concierge not found"
        '409':
          description: Conflict (agent name already exists for this concierge)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Conflict"
                details:
                  - field: "name"
                    reason: "agent name already exists for this concierge"
                    value: "research_assistant"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to insert agent"
    get:
      summary: List all agents for a concierge
      description: Retrieves a list of all agents belonging to the specified concierge.
      operationId: listAgents
      tags:
        - Agents
      parameters:
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      responses:
        '200':
          description: A list of agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'
        '404':
          description: Concierge not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Concierge not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to query agents"

  /concierges/{conciergeId}/agents/{agentId}:
    get:
      summary: Get agent by ID
      description: Retrieves a specific agent by its MongoDB ObjectID under the specified concierge.
      operationId: getAgentById
      tags:
        - Agents
      parameters:
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
        - name: agentId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the agent
          schema:
            type: string
            example: "651da3b57f8641a27e36c582"
      responses:
        '200':
          description: Agent retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Agent'
        '404':
          description: Concierge or agent not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Agent not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to find agent"

components:
  schemas:
    ToolInput:
      type: object
      required:
        - name
        - description
        - required
      properties:
        name:
          type: string
          maxLength: 200
          description: Name of the input parameter
          example: "url"
        description:
          type: string
          maxLength: 2000
          description: Description of the input parameter
          example: "Target URL to send request"
        required:
          type: boolean
          description: Whether the input is required
          example: true

    ToolOutput:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          maxLength: 200
          description: Name of the output parameter
          example: "status_code"
        description:
          type: string
          maxLength: 2000
          description: Description of the output parameter
          example: "HTTP status code"

    CreateToolRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          maxLength: 200
          description: Tool name
          example: "http_request"
        description:
          type: string
          maxLength: 2000
          description: Tool description
          example: "Sends an HTTP request and returns the response"
        inputs:
          type: array
          description: List of tool inputs. Can be omitted, null, or empty array.
          default: []
          items:
            $ref: '#/components/schemas/ToolInput'
        outputs:
          type: array
          description: List of tool outputs. Can be omitted, null, or empty array.
          default: []
          items:
            $ref: '#/components/schemas/ToolOutput'

    UpdateToolRequest:
      type: object
      required:
        - name
        - description
        - version
      properties:
        name:
          type: string
          maxLength: 200
          description: Tool name
          example: "http_request_v2"
        description:
          type: string
          maxLength: 2000
          description: Tool description
          example: "Updated HTTP request tool with timeout"
        version:
          type: integer
          minimum: 1
          description: Current version of the tool required for optimistic locking
          example: 1
        inputs:
          type: array
          description: List of tool inputs. Can be omitted, null, or empty array.
          default: []
          items:
            $ref: '#/components/schemas/ToolInput'
        outputs:
          type: array
          description: List of tool outputs. Can be omitted, null, or empty array.
          default: []
          items:
            $ref: '#/components/schemas/ToolOutput'

    Tool:
      type: object
      required:
        - id
        - name
        - description
        - version
        - inputs
        - outputs
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Hexadecimal MongoDB ObjectID
          example: "651da3b57f8641a27e36c579"
        name:
          type: string
          example: "http_request"
        description:
          type: string
          example: "Sends an HTTP request and returns the response"
        version:
          type: integer
          minimum: 1
          example: 1
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/ToolInput'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/ToolOutput'
        createdAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"

    CreateInstructionRequest:
      type: object
      required:
        - name
        - content
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique instruction name
          example: "search_and_summarize"
        content:
          type: string
          maxLength: 100000
          description: Instruction content describing LLM behavior, referencing tools using {{tool:tool_id}} syntax
          example: "Search the web using {{tool:651da3b57f8641a27e36c579}} and synthesize the findings."

    UpdateInstructionRequest:
      type: object
      required:
        - name
        - content
        - version
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique instruction name
          example: "search_and_summarize_v2"
        content:
          type: string
          maxLength: 100000
          description: Instruction content describing LLM behavior, referencing tools using {{tool:tool_id}} syntax
          example: "Search the web using {{tool:651da3b57f8641a27e36c579}} and format output as markdown."
        version:
          type: integer
          minimum: 1
          description: Current version of the instruction required for optimistic locking
          example: 1

    InstructionSummary:
      type: object
      required:
        - id
        - name
        - content
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Hexadecimal MongoDB ObjectID of the instruction
          example: "651da3b57f8641a27e36c579"
        name:
          type: string
          example: "search_and_summarize"
        content:
          type: string
          example: "Search the web using {{tool:651da3b57f8641a27e36c579}} and synthesize the findings."
        version:
          type: integer
          minimum: 1
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"

    Instruction:
      type: object
      required:
        - id
        - name
        - content
        - tools
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Hexadecimal MongoDB ObjectID of the instruction
          example: "651da3b57f8641a27e36c579"
        name:
          type: string
          example: "search_and_summarize"
        content:
          type: string
          example: "Search the web using {{tool:651da3b57f8641a27e36c579}} and synthesize the findings."
        tools:
          type: array
          description: List of resolved tools referenced by this instruction
          items:
            $ref: '#/components/schemas/Tool'
        version:
          type: integer
          minimum: 1
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"

    CreateConciergeRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique concierge name
          example: "front_desk_assistant"
        description:
          type: string
          maxLength: 2000
          description: Purpose and capabilities of the concierge
          example: "Handles customer inquiries and routing."

    ConciergeSummary:
      type: object
      required:
        - id
        - name
        - description
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Hexadecimal MongoDB ObjectID of the concierge
          example: "651da3b57f8641a27e36c579"
        name:
          type: string
          example: "front_desk_assistant"
        description:
          type: string
          example: "Handles customer inquiries and routing."
        version:
          type: integer
          minimum: 1
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-10-04T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-04T00:00:00Z"

    Concierge:
      type: object
      required:
        - id
        - name
        - description
        - agents
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Hexadecimal MongoDB ObjectID of the concierge
          example: "651da3b57f8641a27e36c579"
        name:
          type: string
          example: "front_desk_assistant"
        description:
          type: string
          example: "Handles customer inquiries and routing."
        agents:
          type: array
          description: List of resolved agents belonging to this concierge
          items:
            $ref: '#/components/schemas/Agent'
        version:
          type: integer
          minimum: 1
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-10-04T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-04T00:00:00Z"

    CreateAgentRequest:
      type: object
      required:
        - name
        - description
        - model
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique agent name
          example: "research_assistant"
        description:
          type: string
          maxLength: 2000
          description: Purpose and capabilities of the agent
          example: "Conducts deep literature research and analysis."
        model:
          type: string
          enum:
            - "gemini-3.5-flash"
            - "gemini-3.5-flash-lite"
          description: Supported foundation model identifier
          example: "gemini-3.5-flash"

    Agent:
      type: object
      required:
        - id
        - conciergeId
        - name
        - description
        - model
        - version
      properties:
        id:
          type: string
          description: Hexadecimal MongoDB ObjectID of the agent
          example: "651da3b57f8641a27e36c579"
        conciergeId:
          type: string
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          example: "651da3b57f8641a27e36c581"
        name:
          type: string
          example: "research_assistant"
        description:
          type: string
          example: "Conducts deep literature research and analysis."
        model:
          type: string
          enum:
            - "gemini-3.5-flash"
            - "gemini-3.5-flash-lite"
          example: "gemini-3.5-flash"
        version:
          type: integer
          minimum: 1
          example: 1

    FieldError:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: Name or path of the field that failed validation
          example: "name"
        reason:
          type: string
          description: Reason why the field failed validation
          example: "tool name cannot exceed 200 characters"
        value:
          nullable: true
          description: Value that caused the validation failure
          example: "A very long tool name..."

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/FieldError'
            - type: string
              example: "Key: 'CreateToolDTO.Name' Error:Field validation for 'Name' failed on the 'required' tag"
