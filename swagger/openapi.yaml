  /concierges/{conciergeId}/concierge-versions/{conciergeVersionId}:
    get:
      summary: Get a concierge version
      operationId: getConciergeVersion
      tags:
        - Concierges
      parameters:
        - name: conciergeId
          in: path
          required: true
          schema:
            type: string
        - name: conciergeVersionId
          in: path
          required: true
          description: draft or a version ID returned in Concierge.conciergeVersions
          schema:
            type: string
            example: draft
      responses:
        '200':
          description: Working concierge or immutable snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SavedConciergeVersion'
        '404':
          description: Concierge version not found

components:
  schemas:
    ToolInput:
      type: object
      required:
        - name
        - description
        - required
      properties:
        name:
          type: string
          maxLength: 200
          description: Name of the input parameter
          example: "url"
        description:
          type: string
          maxLength: 2000
          description: Description of the input parameter
          example: "Target URL to send request"
        required:
          type: boolean
          description: Whether the input is required
          example: true

    ToolOutput:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          maxLength: 200
          description: Name of the output parameter
          example: "status_code"
        description:
          type: string
          maxLength: 2000
          description: Description of the output parameter
          example: "HTTP status code"

    CreateToolRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          maxLength: 200
          description: Tool name
          example: "http_request"
        description:
          type: string
          maxLength: 2000
          description: Tool description
          example: "Sends an HTTP request and returns the response"
        inputs:
          type: array
          description: List of tool inputs. Can be omitted, null, or empty array.
          default: []
          items:
            $ref: '#/components/schemas/ToolInput'
        outputs:
          type: array
          description: List of tool outputs. Can be omitted, null, or empty array.
          default: []
          items:
            $ref: '#/components/schemas/ToolOutput'

    UpdateToolRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          maxLength: 200
          description: Tool name
          example: "http_request_v2"
        description:
          type: string
          maxLength: 2000
          description: Tool description
          example: "Updated HTTP request tool with timeout"
        inputs:
          type: array
          description: List of tool inputs. Can be omitted, null, or empty array.
          default: []
          items:
            $ref: '#/components/schemas/ToolInput'
        outputs:
          type: array
          description: List of tool outputs. Can be omitted, null, or empty array.
          default: []
          items:
            $ref: '#/components/schemas/ToolOutput'

    Tool:
      type: object
      required:
        - id
        - name
        - description
        - inputs
        - outputs
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Hexadecimal MongoDB ObjectID
          example: "651da3b57f8641a27e36c579"
        name:
          type: string
          example: "http_request"
        description:
          type: string
          example: "Sends an HTTP request and returns the response"
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/ToolInput'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/ToolOutput'
        createdAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"

    CreateInstructionRequest:
      type: object
      required:
        - name
        - content
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique instruction name
          example: "search_and_summarize"
        content:
          type: string
          maxLength: 100000
          description: Instruction content describing LLM behavior, referencing tools using {{tool:tool_id}} syntax
          example: "Search the web using {{tool:651da3b57f8641a27e36c579}} and synthesize the findings."

    UpdateInstructionRequest:
      type: object
      required:
        - name
        - content
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique instruction name
          example: "search_and_summarize_v2"
        content:
          type: string
          maxLength: 100000
          description: Instruction content describing LLM behavior, referencing tools using {{tool:tool_id}} syntax
          example: "Search the web using {{tool:651da3b57f8641a27e36c579}} and format output as markdown."

    InstructionSummary:
      type: object
      required:
        - id
        - name
        - content
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Hexadecimal MongoDB ObjectID of the instruction
          example: "651da3b57f8641a27e36c579"
        name:
          type: string
          example: "search_and_summarize"
        content:
          type: string
          example: "Search the web using {{tool:651da3b57f8641a27e36c579}} and synthesize the findings."
        createdAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"

    Instruction:
      type: object
      required:
        - id
        - name
        - content
        - tools
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Hexadecimal MongoDB ObjectID of the instruction
          example: "651da3b57f8641a27e36c579"
        name:
          type: string
          example: "search_and_summarize"
        content:
          type: string
          example: "Search the web using {{tool:651da3b57f8641a27e36c579}} and synthesize the findings."
        tools:
          type: array
          description: List of resolved tools referenced by this instruction
          items:
            $ref: '#/components/schemas/Tool'
        createdAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-03T03:50:00Z"

    CreateConciergeRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique concierge name
          example: "front_desk_assistant"
        description:
          type: string
          maxLength: 2000
          description: Purpose and capabilities of the concierge
          example: "Handles customer inquiries and routing."

    ConciergeSummary:
      type: object
      required: [id, name, description, conciergeVersions, createdAt, updatedAt]
      properties:
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        id:
          type: string
        name:
          type: string
        description:
          type: string
        conciergeVersions:
          type: array
          items:
            $ref: '#/components/schemas/ConciergeVersionDescriptor'

    Concierge:
      type: object
      required: [id, name, description, conciergeVersions, createdAt, updatedAt]
      properties:
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        id:
          type: string
        name:
          type: string
        description:
          type: string
        conciergeVersions:
          type: array
          items:
            $ref: '#/components/schemas/ConciergeVersionDescriptor'

    SavedConciergeVersion:
      type: object
      required: [id, conciergeId, version, saved, agents, instructions, tools, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Concierge version ID
        conciergeId:
          type: string
        version:
          type: integer
        saved:
          type: boolean
        agents:
          type: array
          items:
            $ref: '#/components/schemas/SavedAgent'
        instructions:
          type: array
          items:
            $ref: '#/components/schemas/SavedInstruction'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConciergeVersionDescriptor:
      type: object
      required: [conciergeVersionId, version]
      properties:
        conciergeVersionId:
          type: string
        version:
          type: integer

    SavedAgent:
      type: object
      required: [id, name, description, goal, model, instructions, tools, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        goal:
          type: string
        model:
          type: string
        instructions:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SavedInstruction:
      type: object
      required: [id, name, content, tools, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        content:
          type: string
        tools:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAgentRequest:
      type: object
      required:
        - name
        - description
        - goal
        - model
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique agent name
          example: "research_assistant"
        description:
          type: string
          maxLength: 2000
          description: Purpose and capabilities of the agent
          example: "Conducts deep literature research and analysis."
        goal:
          type: string
          maxLength: 2000
          description: Primary objective or mission of the agent
          example: "Summarize research papers and extract key insights."
        model:
          type: string
          enum:
            - "gemini-3.5-flash"
            - "gemini-3.5-flash-lite"
          description: Supported foundation model identifier
          example: "gemini-3.5-flash"

    UpdateAgentRequest:
      type: object
      required:
        - name
        - description
        - goal
        - model
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique agent name within the concierge
          example: "research_assistant_v2"
        description:
          type: string
          maxLength: 2000
          description: Purpose and capabilities of the agent
          example: "Updated deep literature research and analysis agent."
        goal:
          type: string
          maxLength: 2000
          description: Primary objective or mission of the agent
          example: "Summarize research papers, extract key insights, and generate critical evaluations."
        model:
          type: string
          enum:
            - "gemini-3.5-flash"
            - "gemini-3.5-flash-lite"
          description: Supported foundation model identifier
          example: "gemini-3.5-flash"

    Agent:
      type: object
      required:
        - id
        - conciergeId
        - name
        - description
        - goal
        - model
        - instructions
        - tools
      properties:
        id:
          type: string
          description: Hexadecimal MongoDB ObjectID of the agent
          example: "651da3b57f8641a27e36c579"
        conciergeId:
          type: string
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          example: "651da3b57f8641a27e36c581"
        name:
          type: string
          example: "research_assistant"
        description:
          type: string
          example: "Conducts deep literature research and analysis."
        goal:
          type: string
          example: "Summarize research papers and extract key insights."
        model:
          type: string
          enum:
            - "gemini-3.5-flash"
            - "gemini-3.5-flash-lite"
          example: "gemini-3.5-flash"
        instructions:
          type: array
          description: List of instruction summaries assigned to this agent
          items:
            $ref: '#/components/schemas/InstructionSummary'
        tools:
          type: array
          description: List of tools assigned to this agent
          items:
            $ref: '#/components/schemas/Tool'

    AgentSummary:
      type: object
      required:
        - id
        - conciergeId
        - name
        - description
        - goal
        - model
      properties:
        id:
          type: string
          description: Hexadecimal MongoDB ObjectID of the agent
          example: "651da3b57f8641a27e36c579"
        conciergeId:
          type: string
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          example: "651da3b57f8641a27e36c581"
        name:
          type: string
          example: "research_assistant"
        description:
          type: string
          example: "Conducts deep literature research and analysis."
        goal:
          type: string
          example: "Summarize research papers and extract key insights."
        model:
          type: string
          enum:
            - "gemini-3.5-flash"
            - "gemini-3.5-flash-lite"
          example: "gemini-3.5-flash"

    FieldError:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: Name or path of the field that failed validation
          example: "name"
        reason:
          type: string
          description: Reason why the field failed validation
          example: "tool name cannot exceed 200 characters"
        value:
          nullable: true
          description: Value that caused the validation failure
          example: "A very long tool name..."

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/FieldError'
            - type: string
              example: "Key: 'CreateToolDTO.Name' Error:Field validation for 'Name' failed on the 'required' tag"
