openapi: 3.0.3
info:
  title: Dubhu Designer API
  description: API specification for Dubhu Designer services.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

paths:
  /tools:
    post:
      summary: Create a new tool
      description: Creates a new tool specification with inputs and outputs.
      operationId: createTool
      tags:
        - Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToolRequest'
            example:
              name: "http_request"
              description: "Sends an HTTP request and returns the response"
              inputs:
                - name: "url"
                  description: "Target URL"
                  required: true
                - name: "method"
                  description: "HTTP method (GET, POST, etc.)"
                  required: false
              outputs:
                - name: "status_code"
                  description: "HTTP status code"
                - name: "body"
                  description: "Response body payload"
      responses:
        '201':
          description: Tool created successfully
          headers:
            ETag:
              description: Strong ETag for the created tool representation
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tool'
        '400':
          description: Bad request (invalid payload or missing required fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "name"
                    reason: "tool name cannot exceed 200 characters"
                    value: "..."
        '409':
          description: Conflict (tool name already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Conflict"
                details:
                  - field: "name"
                    reason: "tool name already exists"
                    value: "http_request"
    get:
      summary: List all tools
      description: Retrieves all registered tool specifications without sorting, filtering, or pagination.
      operationId: listTools
      tags:
        - Tools
      responses:
        '200':
          description: List of tools retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tool'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to query tools"

  /tools/{toolId}:
    get:
      summary: Get tool by ID
      description: Retrieves a specific tool specification by its MongoDB ObjectID.
      operationId: getToolById
      tags:
        - Tools
      parameters:
        - name: toolId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the tool
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      responses:
        '200':
          description: Tool retrieved successfully
          headers:
            ETag:
              description: Strong ETag for the current tool representation
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tool'
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Tool not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to find tool: connection refused"
    put:
      summary: Update tool by ID
      description: Updates an existing tool specification. Requires the strong ETag returned when the tool was last read.
      operationId: updateTool
      tags:
        - Tools
      parameters:
        - name: toolId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the tool
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
        - name: If-Match
          in: header
          required: true
          description: Strong ETag from the latest tool representation
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateToolRequest'
            example:
              name: "http_request_v2"
              description: "Updated HTTP request tool with timeout"
              inputs:
                - name: "url"
                  description: "Target URL"
                  required: true
                - name: "timeout"
                  description: "Request timeout in seconds"
                  required: false
              outputs:
                - name: "status_code"
                  description: "HTTP response status code"
      responses:
        '200':
          description: Tool updated successfully
          headers:
            ETag:
              description: Strong ETag for the updated tool representation
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tool'
        '400':
          description: Bad request (invalid payload or validation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "name"
                    reason: "tool name cannot exceed 200 characters"
                    value: "..."
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Tool not found"
        '409':
          description: Conflict (tool name already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: The supplied If-Match ETag does not match the current tool representation
        '428':
          description: If-Match header is required
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to update tool"

  /instructions:
    post:
      summary: Create a new instruction
      description: Creates a new LLM instruction. The content can reference tools using the syntax {{tool:tool_id}}. The service parses these references, verifies that all referenced tools exist in the database, and populates the instruction's tools field with their ObjectIDs. If any referenced tool does not exist, the request is rejected with a 400 Bad Request.
      operationId: createInstruction
      tags:
        - Instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstructionRequest'
            example:
              name: "search_and_summarize"
              content: "Search the web using {{tool:651da3b57f8641a27e36c579}} and synthesize the findings."
      responses:
        '201':
          description: Instruction created successfully
          headers:
            ETag:
              description: Strong ETag for the created instruction representation
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Instruction'
        '400':
          description: Bad request (invalid payload, validation failure, or referenced tools do not exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "referenced tools do not exist: 651da3b57f8641a27e36c579"
        '409':
          description: Conflict (instruction name already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Conflict"
                details:
                  - field: "name"
                    reason: "instruction name already exists"
                    value: "search_and_summarize"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to insert instruction"
    get:
      summary: List all instructions
      description: Retrieves all registered instructions without sorting, filtering, or pagination.
      operationId: listInstructions
      tags:
        - Instructions
      responses:
        '200':
          description: List of instructions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstructionSummary'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to query instructions"

  /instructions/{instructionId}:
    get:
      summary: Get instruction by ID
      description: Retrieves a specific instruction by its MongoDB ObjectID.
      operationId: getInstructionById
      tags:
        - Instructions
      parameters:
        - name: instructionId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the instruction
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      responses:
        '200':
          description: Instruction retrieved successfully
          headers:
            ETag:
              description: Strong ETag for the current instruction representation
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Instruction'
        '404':
          description: Instruction not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Instruction not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to find instruction"
    put:
      summary: Update instruction by ID
      description: Updates an existing instruction. Any tool references in content are resolved. Requires the strong ETag returned when the instruction was last read.
      operationId: updateInstruction
      tags:
        - Instructions
      parameters:
        - name: instructionId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the instruction
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
        - name: If-Match
          in: header
          required: true
          description: Strong ETag from the latest instruction representation
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstructionRequest'
            example:
              name: "search_and_summarize_v2"
              content: "Search the web using {{tool:651da3b57f8641a27e36c579}} and format output as markdown."
      responses:
        '200':
          description: Instruction updated successfully
          headers:
            ETag:
              description: Strong ETag for the updated instruction representation
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Instruction'
        '400':
          description: Bad request (invalid payload, validation failure, or referenced tools do not exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "referenced tools do not exist: 651da3b57f8641a27e36c579"
        '404':
          description: Instruction not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Instruction not found"
        '409':
          description: Conflict (instruction name already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: The supplied If-Match ETag does not match the current instruction representation
        '428':
          description: If-Match header is required
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to update instruction"

  /concierges:
    post:
      summary: Create a new concierge
      description: Creates a new concierge specification. Requires name and description.
      operationId: createConcierge
      tags:
        - Concierges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConciergeRequest'
            example:
              name: "front_desk_assistant"
              description: "Handles customer inquiries and routing."
      responses:
        '201':
          description: Concierge created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Concierge'
        '400':
          description: Bad request (invalid payload or validation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "name"
                    reason: "name is required and cannot be blank"
                    value: ""
        '409':
          description: Conflict (concierge name already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Conflict"
                details:
                  - field: "name"
                    reason: "concierge name already exists"
                    value: "front_desk_assistant"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to insert concierge"
    get:
      summary: List all concierges
      description: Retrieves a list of all concierges.
      operationId: listConcierges
      tags:
        - Concierges
      responses:
        '200':
          description: A list of concierges
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConciergeSummary'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to query concierges"

  /concierges/{conciergeId}:
    put:
      summary: Update concierge name and description
      description: Updates only concierge metadata, independently of working and saved concierge versions.
      operationId: updateConcierge
      tags: [Concierges]
      parameters:
        - name: conciergeId
          in: path
          required: true
          schema: {type: string}
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by concierge GET or create.
          schema: {type: string, example: '"1"'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description]
              properties:
                name: {type: string}
                description: {type: string}
      responses:
        '200':
          description: Updated concierge
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Concierge'}
        '400': {description: Invalid request body}
        '404': {description: Concierge not found}
        '409': {description: Concierge name already exists}
        '412': {description: Invalid or stale ETag}
        '428': {description: If-Match header required}
        '500': {description: Internal server error}
    get:
      summary: Get concierge by ID
      description: Retrieves a specific concierge by its MongoDB ObjectID.
      operationId: getConciergeById
      tags:
        - Concierges
      parameters:
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      responses:
        '200':
          description: Concierge retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Concierge'
        '404':
          description: Concierge not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Concierge not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to find concierge"

  /concierge/{conciergeId}:save:
    post:
      summary: Save an immutable concierge snapshot
      description: Stores the current customer-facing version as a self-contained immutable snapshot, then advances the draft concierge to the next version.
      operationId: saveConcierge
      tags:
        - Concierges
      parameters:
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the draft concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      responses:
        '201':
          description: Concierge snapshot saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SavedConciergeVersion'
        '404':
          description: Concierge or an associated resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /concierges/{conciergeId}/concierge-versions/{conciergeVersionId}/agents:
    post:
      summary: Create a new agent
      description: Creates a new agent specification scoped to the specified concierge. Requires name, description, goal, and model. Agent name must be unique within the same concierge.
      operationId: createAgent
      tags:
        - Agents
      parameters:
        - name: conciergeVersionId
          in: path
          required: true
          description: Use draft or an ID returned in Concierge.conciergeVersions. Changes are allowed for the working version.
          schema:
            type: string
            example: draft
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
            example:
              name: "research_assistant"
              description: "Conducts deep literature research and analysis."
              goal: "Summarize research papers and extract key insights."
              model: "gemini-3.5-flash"
      responses:
        '201':
          description: Agent created successfully
          headers:
            ETag:
              description: Strong ETag for the created agent representation
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request (invalid payload or validation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "name"
                    reason: "name is required and cannot be blank"
                    value: ""
        '404':
          description: Concierge not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Concierge not found"
        '409':
          description: Conflict (agent name already exists for this concierge)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Conflict"
                details:
                  - field: "name"
                    reason: "agent name already exists for this concierge"
                    value: "research_assistant"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to insert agent"
    get:
      summary: List all agents for a concierge
      description: Retrieves a list of all agents belonging to the specified concierge.
      operationId: listAgents
      tags:
        - Agents
      parameters:
        - name: conciergeVersionId
          in: path
          required: true
          description: Use draft or an ID returned in Concierge.conciergeVersions. Changes are allowed for the working version.
          schema:
            type: string
            example: draft
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
      responses:
        '200':
          description: A list of agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentSummary'
        '404':
          description: Concierge not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Concierge not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to query agents"

  /concierges/{conciergeId}/concierge-versions/{conciergeVersionId}/agents/{agentId}:
    get:
      summary: Get agent by ID
      description: Retrieves a specific agent by its MongoDB ObjectID under the specified concierge.
      operationId: getAgentById
      tags:
        - Agents
      parameters:
        - name: conciergeVersionId
          in: path
          required: true
          description: Use draft or an ID returned in Concierge.conciergeVersions. Changes are allowed for the working version.
          schema:
            type: string
            example: draft
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
        - name: agentId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the agent
          schema:
            type: string
            example: "651da3b57f8641a27e36c582"
      responses:
        '200':
          description: Agent retrieved successfully
          headers:
            ETag:
              description: Strong ETag for the current agent representation
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Agent'
        '404':
          description: Concierge or agent not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Agent not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to find agent"
    put:
      summary: Update agent by ID
      description: Updates an existing agent specification under the specified concierge. Name, description, goal, and model can be updated. Requires the strong ETag returned when the agent was last read.
      operationId: updateAgent
      tags:
        - Agents
      parameters:
        - name: conciergeVersionId
          in: path
          required: true
          description: Use draft or an ID returned in Concierge.conciergeVersions. Changes are allowed for the working version.
          schema:
            type: string
            example: draft
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
        - name: agentId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the agent
          schema:
            type: string
            example: "651da3b57f8641a27e36c582"
        - name: If-Match
          in: header
          required: true
          description: Strong ETag from the latest agent representation
          schema:
            type: string
            example: '"1"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
            example:
              name: "research_assistant_v2"
              description: "Updated deep literature research and analysis agent."
              goal: "Summarize research papers, extract key insights, and generate critical evaluations."
              model: "gemini-3.5-flash"
      responses:
        '200':
          description: Agent updated successfully
          headers:
            ETag:
              description: Strong ETag for the updated agent representation
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request (invalid payload or validation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Validation failed"
                details:
                  - field: "name"
                    reason: "name cannot exceed 200 characters"
                    value: "..."
        '404':
          description: Concierge or agent not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Agent not found"
        '409':
          description: Conflict (agent name already exists for this concierge)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Conflict"
                details:
                  - field: "name"
                    reason: "agent name already exists for this concierge"
                    value: "research_assistant"
        '412':
          description: The supplied If-Match ETag does not match the current agent representation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          description: If-Match header is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to update agent"

  /concierges/{conciergeId}/concierge-versions/{conciergeVersionId}/agents/{agentId}/instructions/{instructionId}:
    post:
      summary: Assign an instruction to an agent
      description: Assigns an existing instruction specification to the agent. Validates that the concierge, agent, and instruction exist. Duplicate assignments are handled idempotently.
      operationId: assignInstructionToAgent
      tags:
        - Agents
      parameters:
        - name: conciergeVersionId
          in: path
          required: true
          description: Use draft or an ID returned in Concierge.conciergeVersions. Changes are allowed for the working version.
          schema:
            type: string
            example: draft
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
        - name: agentId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the agent
          schema:
            type: string
            example: "651da3b57f8641a27e36c582"
        - name: instructionId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the instruction
          schema:
            type: string
            example: "651da3b57f8641a27e36c580"
      responses:
        '409':
          description: Saved concierge versions are immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Instruction assigned successfully
        '404':
          description: Concierge, agent, or instruction not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Instruction not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to assign instruction to agent"
    delete:
      summary: Unassign an instruction from an agent
      description: Removes an instruction assignment from the agent. Validates that the concierge and agent exist. If the instruction is not assigned, the operation succeeds idempotently.
      operationId: unassignInstructionFromAgent
      tags:
        - Agents
      parameters:
        - name: conciergeVersionId
          in: path
          required: true
          description: Use draft or an ID returned in Concierge.conciergeVersions. Changes are allowed for the working version.
          schema:
            type: string
            example: draft
        - name: conciergeId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the parent concierge
          schema:
            type: string
            example: "651da3b57f8641a27e36c579"
        - name: agentId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the agent
          schema:
            type: string
            example: "651da3b57f8641a27e36c582"
        - name: instructionId
          in: path
          required: true
          description: Hexadecimal MongoDB ObjectID of the instruction
          schema:
            type: string
            example: "651da3b57f8641a27e36c580"
      responses:
        '409':
          description: Saved concierge versions are immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Instruction unassigned successfully
        '404':
          description: Concierge, agent, or instruction not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Agent not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "failed to unassign instruction from agent"

  /concierges/{conciergeId}/concierge-versions/{conciergeVersionId}/agents/{agentId}/tools/{toolId}:
